<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Recommendation System</title>
    
    <!-- ==================== CSS STYLES ==================== -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: #1e293b;
            max-width: 600px;
            width: 100%;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        h1 {
            text-align: center;
            color: #38bdf8;
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-box input {
            flex: 1;
            padding: 12px 16px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #ffffff;
            outline: none;
        }

        .search-box input:focus {
            border-color: #38bdf8;
        }

        .search-box button {
            padding: 12px 20px;
            background-color: #0284c7;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-box button:hover {
            background-color: #0369a1;
        }

        .error-msg {
            color: #f87171;
            background-color: #450a0a;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }

        .results-section {
            display: none;
        }

        .results-section h2 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #e2e8f0;
        }

        .results-section h2 span {
            color: #38bdf8;
        }

        .movie-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .movie-card {
            background-color: #334155;
            padding: 12px 16px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .rank {
            background-color: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .movie-title {
            font-size: 1rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎬 Movie Recommender AI</h1>
        <p class="subtitle">Enter a movie name to get Top 10 recommendations</p>

        <!-- Search Box -->
        <div class="search-box">
            <input type="text" id="movieInput" placeholder="e.g. Avatar, Inception, Iron Man...">
            <button onclick="getRecommendations()">Search</button>
        </div>

        <!-- Error Message Container -->
        <div id="errorMsg" class="error-msg"></div>

        <!-- Recommendation Results Container -->
        <div id="resultsSection" class="results-section">
            <h2>Top 10 Recommendations for <span id="searchedTerm"></span>:</h2>
            <ul id="movieList" class="movie-list"></ul>
        </div>
    </div>

    <!-- ==================== JAVASCRIPT ==================== -->
    <script>
        async function getRecommendations() {
            const movieInput = document.getElementById("movieInput").value.trim();
            const errorMsg = document.getElementById("errorMsg");
            const resultsSection = document.getElementById("resultsSection");
            const movieList = document.getElementById("movieList");
            const searchedTerm = document.getElementById("searchedTerm");

            // Reset UI State
            errorMsg.style.display = "none";
            resultsSection.style.display = "none";
            movieList.innerHTML = "";

            if (!movieInput) {
                errorMsg.innerText = "Kripya movie ka naam enter karein!";
                errorMsg.style.display = "block";
                return;
            }

            try {
                // FastAPI endpoint ko Call kar rahe hain JavaScript Fetch API se
                const response = await fetch("/api/recommend", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ movie_name: movieInput })
                });

                const data = await response.json();

                if (data.success) {
                    searchedTerm.innerText = `"${movieInput}"`;
                    
                    // Top 10 result list me display kar rahe hain
                    data.recommendations.forEach((movie, index) => {
                        const li = document.createElement("li");
                        li.className = "movie-card";
                        li.innerHTML = `
                            <span class="rank">#${index + 1}</span>
                            <span class="movie-title">${movie}</span>
                        `;
                        movieList.appendChild(li);
                    });

                    resultsSection.style.display = "block";
                } else {
                    errorMsg.innerText = data.message;
                    errorMsg.style.display = "block";
                }
            } catch (err) {
                errorMsg.innerText = "Server se connect karne me problem aayi!";
                errorMsg.style.display = "block";
            }
        }
    </script>
</body>
</html>
